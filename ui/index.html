<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MultiScraper</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f9f9f8;
  --surface: #ffffff;
  --border: rgba(0,0,0,0.1);
  --border-md: rgba(0,0,0,0.2);
  --text: #1a1a1a;
  --muted: #666;
  --hint: #999;
  --accent: #2563eb;
  --accent-bg: #eff6ff;
  --accent-text: #1d4ed8;
  --danger-bg: #fef2f2;
  --danger-text: #dc2626;
  --radius: 10px;
  --radius-sm: 6px;
  --mono: 'Courier New', monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111110;
    --surface: #1c1c1b;
    --border: rgba(255,255,255,0.1);
    --border-md: rgba(255,255,255,0.2);
    --text: #e8e8e5;
    --muted: #999;
    --hint: #666;
    --accent-bg: #1e3a5f;
    --accent-text: #93c5fd;
    --danger-bg: #2d1515;
    --danger-text: #f87171;
  }
}
body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem 1rem; }
.wrap { max-width: 720px; margin: 0 auto; }
h1 { font-size: 18px; font-weight: 500; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 8px; color: var(--text); }
h1 i { font-size: 22px; color: var(--muted); }

.search-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
.search-row input { flex: 1; padding: 9px 13px; font-size: 14px; border: 0.5px solid var(--border-md); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); outline: none; }
.search-row input:focus { border-color: var(--accent); }
.search-row button { padding: 9px 18px; font-size: 14px; border: 0.5px solid var(--border-md); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 6px; }
.search-row button:hover { background: var(--bg); }
.search-row button:active { transform: scale(0.98); }

.card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 1rem; }
.cover-row { display: flex; gap: 1.25rem; padding: 1.25rem; border-bottom: 0.5px solid var(--border); }
.cover { width: 110px; min-width: 110px; height: 155px; border-radius: var(--radius-sm); background: var(--bg); border: 0.5px solid var(--border); overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--hint); font-size: 13px; }
.cover img { width: 100%; height: 100%; object-fit: cover; }
.meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 9px; }
.badges { display: flex; flex-wrap: wrap; gap: 5px; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 0.5px solid var(--border-md); color: var(--muted); background: var(--bg); }
.badge.lang { background: var(--accent-bg); color: var(--accent-text); border-color: transparent; }
.id-mono { font-family: var(--mono); font-size: 11px; color: var(--hint); background: var(--bg); border: 0.5px solid var(--border); border-radius: 4px; padding: 2px 6px; }
.title { font-size: 15px; font-weight: 500; line-height: 1.4; }
.row { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; }
.row-label { color: var(--hint); min-width: 60px; padding-top: 2px; display: flex; align-items: center; gap: 4px; }
.row-val { color: var(--muted); }
.tags-wrap { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 0.5px solid var(--border); color: var(--muted); }

.pages-section { padding: 1rem 1.25rem; }
.pages-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; }
.pages-head span { color: var(--muted); }
.pages-head .count { color: var(--hint); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; }
.thumb { aspect-ratio: 2/3; background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; position: relative; cursor: pointer; }
.thumb:hover { border-color: var(--border-md); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb .num { position: absolute; bottom: 3px; right: 4px; font-size: 10px; background: rgba(0,0,0,0.45); color: #fff; padding: 1px 4px; border-radius: 3px; }
.show-more { display: block; width: 100%; margin-top: 10px; font-size: 13px; color: var(--muted); border: 0.5px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); padding: 7px; cursor: pointer; }
.show-more:hover { background: var(--bg); }

.state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 3rem; color: var(--hint); font-size: 14px; text-align: center; }
.state i { font-size: 36px; }
.spinner { width: 26px; height: 26px; border: 2px solid var(--border-md); border-top-color: var(--muted); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.err { font-size: 13px; color: var(--danger-text); background: var(--danger-bg); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 1rem; display: flex; align-items: center; gap: 7px; }
</style>
</head>
<body>
<div class="wrap">
  <h1><i class="ti ti-books"></i> MultiScraper</h1>

  <div class="search-row">
    <input id="inp" type="text" placeholder="nhentai gallery ID or URL, e.g. 571652" />
    <button onclick="lookup()"><i class="ti ti-search"></i> Look up</button>
  </div>

  <div id="err"></div>
  <div id="out">
    <div class="state"><i class="ti ti-book-2"></i><span>Enter a gallery ID above</span></div>
  </div>
</div>

<script>
function extractId(s) {
  s = s.trim();
  const m = s.match(/\/(\d+)/);
  if (m) return m[1];
  if (/^\d+$/.test(s)) return s;
  return null;
}

function tagHtml(arr) {
  return (arr || []).map(t => `<span class="tag">${t}</span>`).join('');
}

function row(icon, label, content) {
  if (!content) return '';
  return `<div class="row">
    <span class="row-label"><i class="ti ti-${icon}"></i>${label}</span>
    <div class="row-val">${content}</div>
  </div>`;
}

function render(d) {
  const pages = d.pages || [];
  const visible = pages.slice(0, 18);
  const more = pages.length > 18
    ? `<button class="show-more" onclick="alert('Open the full URL list in console.')">+ ${pages.length - 18} more pages</button>`
    : '';

  document.getElementById('out').innerHTML = `
    <div class="card">
      <div class="cover-row">
        <div class="cover">
          ${visible[0] ? `<img src="${visible[0]}" loading="lazy" onerror="this.style.display='none'">` : '<i class="ti ti-photo-off" style="font-size:28px"></i>'}
        </div>
        <div class="meta">
          <div class="badges">
            <span class="id-mono">#${d.id || '—'}</span>
            ${(d.languages || []).map(l => `<span class="badge lang">${l}</span>`).join('')}
            ${d.category ? `<span class="badge">${d.category}</span>` : ''}
          </div>
          <div class="title">${d.title || '(no title)'}</div>
          ${row('paint', 'Artist', tagHtml(d.artists) || '—')}
          ${row('building', 'Group', tagHtml(d.groups) || '—')}
          ${row('books', 'Series', tagHtml(d.series) || '—')}
        </div>
      </div>
      <div class="pages-section">
        <div class="pages-head"><span>Pages</span><span class="count">${pages.length} total</span></div>
        <div class="grid">
          ${visible.map((url, i) => `<div class="thumb"><img src="${url}" loading="lazy" onerror="this.style.display='none'"><span class="num">${i+1}</span></div>`).join('')}
        </div>
        ${more}
      </div>
    </div>
    ${(d.tags || []).length ? `<div class="card" style="padding:1rem 1.25rem;">
      <div class="row"><span class="row-label"><i class="ti ti-tag"></i>Tags</span>
      <div class="tags-wrap">${tagHtml(d.tags)}</div></div>
    </div>` : ''}
  `;
}

async function lookup() {
  const raw = document.getElementById('inp').value;
  const id  = extractId(raw);
  document.getElementById('err').innerHTML = '';

  if (!id) {
    document.getElementById('err').innerHTML =
      `<div class="err"><i class="ti ti-alert-circle"></i> Couldn't parse a gallery ID. Try a plain number like <code>571652</code>.</div>`;
    return;
  }

  document.getElementById('out').innerHTML =
    `<div class="state"><div class="spinner"></div><span>Fetching gallery ${id}…</span></div>`;

  try {
    const res = await fetch(`/api/nhentai/${id}`);
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || res.statusText);
    }
    render(await res.json());
  } catch (e) {
    document.getElementById('out').innerHTML =
      `<div class="state"><i class="ti ti-wifi-off"></i><span>${e.message || 'Failed to fetch gallery'}</span></div>`;
  }
}

document.getElementById('inp').addEventListener('keydown', e => {
  if (e.key === 'Enter') lookup();
});
</script>
</body>
</html>
